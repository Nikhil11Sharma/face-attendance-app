name: face_attendance
description: AI-powered face recognition attendance for colleges
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_mlkit_face_detection: ^0.11.0
  camera: ^0.11.0+2
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  go_router: ^14.3.0
  encrypt: ^5.0.3
  uuid: ^4.5.0
  logger: ^2.4.0
  permission_handler: ^11.3.1
  image: ^4.2.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  share_plus: ^10.0.3
  pdf: ^3.11.1
  excel: ^4.0.6
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
