name: face_attendance
description: AI-powered face recognition attendance system for colleges
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # ML Kit - Face Detection
  google_mlkit_face_detection: ^0.9.0

  # TFLite for MobileFaceNet + Anti-Spoofing
  tflite_flutter: ^0.10.4

  # Camera
  camera: ^0.10.5+9

  # Local Database - SQLite (offline-first)
  sqflite: ^2.3.2
  path: ^1.9.0

  # Encryption
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0
  pointycastle: ^3.7.4

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0

  # Excel Export
  excel: ^4.0.2

  # Image Processing
  image: ^4.1.7

  # Connectivity
  connectivity_plus: ^5.0.2

  # Local Notifications
  flutter_local_notifications: ^17.1.2

  # Permissions
  permission_handler: ^11.3.1

  # Charts for Reports
  fl_chart: ^0.68.0

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  rxdart: ^0.27.7
  collection: ^1.18.0
  logger: ^2.3.0
  dio: ^5.4.3+1
  get_it: ^7.7.0
  injectable: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  injectable_generator: ^2.6.1
  mockito: ^5.4.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
