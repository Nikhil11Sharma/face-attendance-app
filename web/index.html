<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI-powered face recognition attendance system for colleges.">

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Face Attendance">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1A73E8">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Social / SEO -->
  <meta property="og:title" content="Face Attendance – Smart College Attendance">
  <meta property="og:description" content="Mark student attendance in seconds using AI face recognition.">
  <meta property="og:type" content="website">

  <title>Face Attendance</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    body {
      margin: 0;
      background-color: #0D47A1;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Install banner */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1A73E8;
      color: white;
      padding: 16px 20px;
      z-index: 9999;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.3);
    }
    #install-banner.show { display: flex; }
    #install-btn {
      background: white;
      color: #1A73E8;
      border: none;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #dismiss-btn {
      background: none;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
      margin-left: 12px;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <span>Loading Face Attendance...</span>
  </div>

  <!-- Install Banner -->
  <div id="install-banner">
    <div>
      <strong>📲 Install Face Attendance</strong><br>
      <small>Add to home screen for the best experience</small>
    </div>
    <div>
      <button id="install-btn">Install</button>
      <button id="dismiss-btn">✕</button>
    </div>
  </div>

  <script>
    // PWA Install prompt
    let deferredPrompt;
    const banner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');
    const dismissBtn = document.getElementById('dismiss-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      banner.classList.remove('show');
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });

    dismissBtn.addEventListener('click', () => {
      banner.classList.remove('show');
    });

    window.addEventListener('appinstalled', () => {
      banner.classList.remove('show');
      deferredPrompt = null;
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
